<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas de reassentamentos habitacionais | Petrópolis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#242424;--muted:#686868;--line:#dedbd5;--paper:#fff;--soft:#f5f3ef;--accent:#8b5e45;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.72 Poppins,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 28px 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding:0 0 16px}.brand{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}a{color:var(--accent)}.back{border:1px solid var(--line);border-radius:3px;padding:7px 12px;text-decoration:none;font-size:12px}.eyebrow{margin:34px 0 6px;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.13em}h1{font:500 clamp(28px,5vw,44px)/1.12 var(--serif);margin:0 0 10px}.sub{color:var(--muted);margin:0 0 22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:24px 0}.stat{background:var(--soft);padding:13px 15px;min-height:84px}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:15px;font-weight:600;margin-top:4px}.section{border-top:1px solid var(--line);padding:22px 0}.section h2{font:500 23px/1.2 var(--serif);margin:0 0 12px}.section p{max-width:850px;margin:0 0 10px}.facts{display:grid;grid-template-columns:190px 1fr;gap:7px 18px;max-width:900px}.facts b{font-weight:500;color:var(--muted)}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid var(--line);padding:4px 8px;font-size:11px;color:var(--muted)}.notice{background:var(--soft);padding:13px 15px;color:var(--muted);font-size:12px}.map{width:100%;height:330px;border:1px solid var(--line)}.empty{color:var(--muted);font-size:12px;border-left:2px solid var(--line);padding:8px 12px}.footer{border-top:1px solid var(--line);padding-top:15px;margin-top:25px;color:var(--muted);font-size:11px}@media(max-width:680px){.wrap{padding:16px}.stats{grid-template-columns:rep </style></head><body><main class="wrap"><header class="top"><div class="brand">Atlas de reassentamentos habitacionais · Petrópolis</div><a class="back" href="index.html">← Voltar ao mapa</a></header><div id="content"><p>Carregando…</p></div><footer class="footer">Fonte principal: TFG “Da Cidade Imperial à Diáspora das Águas”. Informações não encontradas no inventário são identificadas como lacunas e não foram completadas por suposição.</footer></main><script src="dados.js"></script><script>
const id=Number(new URLSearchParams(location.search).get('id'));const c=CONJUNTOS.find(x=>x.id===id);const root=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const list=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="empty">O TFG enviado não apresenta registros específicos nesta seção. O conteúdo pode ser complementado com documentação da pesquisa.</div>';
if(!c){root.innerHTML='<h1>Conjunto não encontrado</h1><a href="index.html">Voltar ao mapa</a>';}else{document.title=c.nome+' | Atlas de reassentamentos';let lat=c.latitude,lon=c.longitude,d=.008,bbox=[lon-d,lat-d,lon+d,lat+d].join('%2C');root.innerHTML=`<p class="eyebrow">Ficha do inventário · ${esc(c.marco)}</p><h1>${esc(c.nome)}</h1><p class="sub">${esc(c.localizacao)} · Petrópolis, Rio de Janeiro</p><div class="stats"><div class="stat"><small>Unidades habitacionais</small><strong>${esc(c.unidades)}</strong></div><div class="stat"><small>Marco temporal</small><strong>${esc(c.marco)}</strong></div><div class="stat"><small>Agente / programa</small><strong>${esc(c.programa)}</strong></div><div class="stat"><small>Situação</small><strong>${esc(c.situacao)}</strong></div></div>
<section class="section"><h2>Histórico e relação com os desastres</h2><p>${esc(c.historico)}</p><p><b>Origem / relação com desastre:</b> ${esc(c.origem)}</p></section>
<section class="section"><h2>Características habitacionais</h2><div class="facts"><b>Tipologia / configuração</b><span>${esc(c.tipologia)}</span><b>Programa e agentes</b><span>${esc(c.programa)}</span><b>Interlocução registrada no inventário</b><span>${esc(c.interlocucao)}</span><b>Marco / entrega</b><span>${esc(c.marco)}</span></div></section>
<section class="section"><h2>Inserção urbana e localização</h2><p>${esc(c.localizacao)}</p><p class="empty">O mapa abaixo utiliza as coordenadas que já estavam cadastradas no mapa digital original. Elas funcionam como referência cartográfica e devem ser conferidas em campo ou em base georreferenciada antes de uso técnico.</p><iframe class="map" title="Localização de ${esc(c.nome)}" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}"></iframe><p><a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=16/${lat}/${lon}" target="_blank" rel="noopener">Abrir mapa em tela cheia</a></p></section>
<section class="section"><h2>Dados socioespaciais</h2><p>Informações territoriais e habitacionais identificadas no inventário:</p>${list(c.dadosSocioespaciais)}<div class="notice">O TFG propõe investigar renda, raça/cor, saneamento, áreas de risco, hidrografia, declividade, cobertura vegetal e desmatamento. Também indica que o Índice de Vulnerabilidade Socioespacial está em desenvolvimento. Esses indicadores não foram presumidos nesta ficha.</div></section>
<section class="section"><h2>Deslocamentos e trajetórias de vida</h2><p>${esc(c.origem)}</p><p class="empty">A interlocução indicada no inventário é: ${esc(c.interlocucao)}. O TFG não traz, na tabela-síntese, depoimentos ou trajetórias individuais detalhadas para esta ficha.</p></section>
<section class="section"><h2>Fotografias</h2><div class="empty">O material do TFG enviado não contém fotografias específicas deste conjunto. A seção fica preparada para receber imagens de campo, com legenda, autoria e data.</div></section>
<section class="section"><h2>Documentos e notícias</h2><div class="empty">Nenhum documento ou notícia individualizado para este empreendimento na tabela-síntese do TFG. Inserir links ou arquivos apenas após conferência da fonte.</div></section>
<section class="section"><h2>Fontes e referências</h2><ul><li>TFG “Da Cidade Imperial à Diáspora das Águas”, p. 7–9: cronologia das respostas habitacionais e contexto histórico.</li><li>TFG “Da Cidade Imperial à Diáspora das Águas”, p. 11: inventário de localização, marco/entrega, unidades, tipologia, agentes, origem/relação com desastre, situação e interlocução.</li><li>TFG “Da Cidade Imperial à Diáspora das Águas”, p. 15: categorias de análise propostas para o Atlas.</li></ul></section>`;}
</script></body></html>
